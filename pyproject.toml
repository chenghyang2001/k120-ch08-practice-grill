[project]
name = "sudoku"
version = "0.1.0"
description = "tkinter 數獨桌面 app：自動出題（唯一解）、遊玩、提示、自動解"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sudoku = "sudoku.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 讓 pytest 在未安裝套件時也能從 src layout 匯入 sudoku
pythonpath = ["src"]
addopts = "-ra"
